<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
  /* The body in 3D, alone on the screen. The app tells it how each muscle is doing and what to call it;
     it tells the app which muscle was tapped. Built into assets/body/body.html by build.mjs. */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: transparent; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  #stage { position: absolute; inset: 0; touch-action: none; }
  canvas { width: 100%; height: 100%; display: block; outline: none; opacity: 0; transition: opacity .35s ease; }
  canvas.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { canvas { transition: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
</div>
<script>window.__BODY_B64 = "/*BODY*/";</script>
<script>/*THREE*/</script>
<script>/*ORBIT*/</script>
<script>
(function () {
  // The side each muscle is best seen from, in degrees around the body.
  var VIEW = { chest: 0, shoulders: 35, back: 180, biceps: 12, triceps: 168, forearms: 150, abs: 0, quads: 0, glutes: 180, hamstrings: 180, calves: 180 };
  // The parts some muscles are drawn in (scripts/body/split.mjs); the others are drawn whole.
  var MUSCLE_OF = {
    'front-delts': 'shoulders', 'side-delts': 'shoulders', 'rear-delts': 'shoulders',
    'lats': 'back', 'upper-back': 'back', 'lower-back': 'back',
    'upper-chest': 'chest', 'lower-chest': 'chest',
    'rectus-abs': 'abs', 'obliques': 'abs',
    'glute-max': 'glutes', 'glute-med': 'glutes',
    'gastrocnemius': 'calves', 'soleus': 'calves'
  };
  var COLORS = { good: 0x2FCB55, low: 0xFF9A1F, bad: 0xFF5A3C };
  var state = { dark: true, levels: {}, top: 0, bottom: 0, sheet: 0.55 };
  var selected = null, ready = false;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), canvas = $('gl');

  function post(message) {
    var text = JSON.stringify(message);
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(text);
    else if (window.parent !== window) window.parent.postMessage(text, '*');
  }
  // A part has its own level when the app gives one, else its muscle's.
  function level(name) { return state.levels[name] || state.levels[MUSCLE_OF[name] || name] || 'good'; }

  // Meshes by name (a part, or a muscle drawn whole); their centres, to grow from; each muscle's sphere.
  var renderer, scene, camera, controls, meshes = {}, names = [], skin = null, other = null, centers = {}, mcenters = {}, mradii = {}, selectedPart = null;
  var anim = null, pulse = 0, needs = true, POLAR = Math.PI / 2 - 0.06, GREY = new THREE.Color(0x4a4b52);

  function init(buf) {
    try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true }); } catch (e) { post({ type: 'failed' }); return; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(26, 1, 0.05, 40);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x30323a, 0.85));
    var key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(1.5, 2.5, 3); camera.add(key);
    var rim = new THREE.DirectionalLight(0x9fb4ff, 0.35); rim.position.set(-2, 1, -3); camera.add(rim);
    scene.add(camera);

    var hl = new DataView(buf).getUint32(0, true);
    var header = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, hl)));
    var base = 4 + hl, min = header.min, max = header.max;
    header.groups.forEach(function (g) {
      var q = new Uint16Array(buf, base + g.pos, g.verts * 3), p = new Float32Array(g.verts * 3);
      for (var i = 0; i < g.verts; i++) {
        var x = min[0] + q[i * 3] / 65535 * (max[0] - min[0]), y = min[1] + q[i * 3 + 1] / 65535 * (max[1] - min[1]), z = min[2] + q[i * 3 + 2] / 65535 * (max[2] - min[2]);
        var px = x / 1000, py = z / 1000, pz = -y / 1000 - 0.096;
        p[i * 3] = px; p[i * 3 + 1] = py; p[i * 3 + 2] = pz;
      }
      var idx = g.wide ? new Uint32Array(buf, base + g.idx, g.tris * 3) : new Uint16Array(buf, base + g.idx, g.tris * 3);
      var geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
      geo.setIndex(new THREE.BufferAttribute(idx, 1));
      geo.computeVertexNormals(); geo.computeBoundingSphere();
      var mesh;
      if (g.name === 'skin') {
        // Opaque, but drawn deeper than it is (less on the head): the muscles under it win, and where
        // there is none it closes the body as a mannequin.
        mesh = skin = new THREE.Mesh(geo, new THREE.ShaderMaterial({
          uniforms: { c: { value: new THREE.Color(0x5a5c64) }, push: { value: 0.1 } },
          vertexShader: 'uniform float push; varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); vec4 p = projectionMatrix * mv; float deep = mix(push, 0.02, smoothstep(1.47, 1.55, position.y)); vec4 q = projectionMatrix * vec4(mv.xyz - vV * deep, 1.0); p.z = q.z / q.w * p.w; gl_Position = p; }',
          fragmentShader: 'uniform vec3 c; varying vec3 vN; varying vec3 vV; void main(){ float d = max(dot(normalize(vN), normalize(vV)), 0.0); gl_FragColor = vec4(c * (0.3 + 0.7 * d), 1.0); }'
        }));
      } else if (g.name === 'other') {
        mesh = other = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x46474e, roughness: 0.75, metalness: 0 }));
      } else {
        mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55, metalness: 0, emissive: 0x000000 }));
        mesh.userData.k = MUSCLE_OF[g.name] || g.name; mesh.userData.part = MUSCLE_OF[g.name] ? g.name : null;
        meshes[g.name] = mesh; names.push(g.name);
        centers[g.name] = geo.boundingSphere.center.clone();
        geo.computeBoundingBox();
      }
      scene.add(mesh);
    });
    // Each muscle, whole: where the camera goes to look at it.
    var boxes = {};
    names.forEach(function (n) {
      var k = meshes[n].userData.k;
      boxes[k] = boxes[k] ? boxes[k].union(meshes[n].geometry.boundingBox) : meshes[n].geometry.boundingBox.clone();
    });
    Object.keys(boxes).forEach(function (k) {
      var sphere = boxes[k].getBoundingSphere(new THREE.Sphere());
      mcenters[k] = sphere.center; mradii[k] = sphere.radius;
    });

    controls = new THREE.OrbitControls(camera, canvas);
    controls.enablePan = false; controls.enableDamping = true; controls.dampingFactor = 0.12;
    controls.rotateSpeed = 0.9; controls.zoomSpeed = 0.9;
    controls.minDistance = 0.9; controls.maxDistance = 11;
    // Turns left and right only.
    controls.minPolarAngle = controls.maxPolarAngle = POLAR;
    controls.addEventListener('change', function () { needs = true; });
    controls.addEventListener('start', function () { anim = null; });

    resize(); bindPick();
    ready = true; apply(); look(0.3, true);
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
    requestAnimationFrame(loop);
    canvas.className = 'on';
    post({ type: 'ready' });
  }

  function setCamera(az, polar, dist) {
    var t = controls.target;
    camera.position.set(t.x + dist * Math.sin(polar) * Math.sin(az), t.y + dist * Math.cos(polar), t.z + dist * Math.sin(polar) * Math.cos(az));
    camera.lookAt(t);
  }
  function current() {
    var o = camera.position.clone().sub(controls.target), dist = o.length();
    return { az: Math.atan2(o.x, o.z), polar: Math.acos(Math.max(-1, Math.min(1, o.y / dist))), dist: dist, target: controls.target.clone() };
  }
  function flyTo(az, polar, dist, target, now) {
    var from = current(), d = az - from.az;
    while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
    var to = { az: from.az + d, polar: polar, dist: dist, target: target };
    if (reduce || now) { anim = null; controls.target.copy(target); setCamera(to.az, polar, dist); needs = true; return; }
    anim = { from: from, to: to, t0: performance.now(), ms: 700 };
  }
  // What the bars of the app and its sheet hide, as fractions of the stage.
  function covers() {
    var H = stage.clientHeight || 1;
    return { t: state.top / H, b: selected ? state.sheet : state.bottom / H };
  }
  // The distance and target that put a thing of this height and width in the middle of what stays in sight.
  function frame(cy, span, wspan) {
    var c = covers(), u = Math.max(0.2, 1 - c.t - c.b), tan = Math.tan(camera.fov * Math.PI / 360);
    var dist = Math.min(10.5, Math.max(span / u / (2 * tan), wspan / (2 * tan * camera.aspect), 1.5));
    return { dist: dist, target: new THREE.Vector3(0, cy - ((c.b - c.t) / 2) * 2 * dist * tan, 0) };
  }
  function look(az, now) {
    var f = selected && mcenters[selected] ? frame(mcenters[selected].y, mradii[selected] * 2.5, mradii[selected] * 2.4) : frame(0.86, 1.82, 1.62);
    flyTo(az == null ? current().az : az, POLAR, f.dist, f.target, now);
  }

  // The app's colours, levels and names, as soon as the body is there.
  function apply() {
    if (!ready) return;
    skin.material.uniforms.c.value.setHex(state.dark ? 0x5a5c64 : 0xc3c5cc);
    other.material.color.setHex(state.dark ? 0x46474e : 0xb1b3ba);
    GREY.setHex(state.dark ? 0x4a4b52 : 0xb9bbc2);
    names.forEach(function (n) { meshes[n].userData.dirty = true; });
    fade();
  }
  // 1 is grey like the rest of the body. With a part chosen, the rest of its muscle goes half grey.
  function fade() {
    names.forEach(function (n) {
      var m = meshes[n], mine = selected === m.userData.k;
      m.userData.goal = !selected ? 0 : !mine ? 1 : selectedPart && m.userData.part !== selectedPart ? 0.55 : 0;
      m.userData.lift = mine && (!selectedPart || m.userData.part === selectedPart) ? 1 : 0;
    });
    needs = true;
  }
  function select(k, part) {
    part = part || null;
    if (k === selected && part === selectedPart) return;
    var turn = k !== selected;
    selected = k; selectedPart = part; pulse = performance.now();
    fade();
    if (ready && turn) look(k ? VIEW[k] * Math.PI / 180 : null);
  }

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight; if (!w || !h || !renderer) return;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); needs = true;
  }

  function bindPick() {
    var down = null, ray = new THREE.Raycaster(), v = new THREE.Vector2();
    canvas.addEventListener('pointerdown', function (e) { down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId }; });
    canvas.addEventListener('pointerup', function (e) {
      if (!down || down.id !== e.pointerId) return;
      var moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
      if (moved > 8 || dt > 500) return;
      var b = canvas.getBoundingClientRect();
      v.set((e.clientX - b.left) / b.width * 2 - 1, -((e.clientY - b.top) / b.height) * 2 + 1);
      ray.setFromCamera(v, camera);
      var hits = ray.intersectObjects(names.map(function (n) { return meshes[n]; }), false);
      if (!hits.length) return;
      // A muscle opens its detail, on the part tapped; a tap beside the body does nothing.
      var hit = hits[0].object.userData;
      select(hit.k, hit.part);
      post({ type: 'select', muscle: hit.k, part: hit.part });
    });
  }

  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  var last = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (document.hidden) return;
    // By time, not by frame: the same pace on a slow frame rate.
    var step = 1 - Math.pow(0.82, Math.min(120, now - last) / 16.7); last = now;
    if (anim) {
      var t = Math.min(1, (now - anim.t0) / anim.ms), e = ease(t), a = anim.from, b = anim.to;
      controls.target.lerpVectors(a.target, b.target, e);
      setCamera(a.az + (b.az - a.az) * e, a.polar + (b.polar - a.polar) * e, a.dist + (b.dist - a.dist) * e);
      if (t >= 1) anim = null; needs = true;
    } else {
      controls.update();
    }
    // The other muscles go grey, the chosen one lifts and glows.
    names.forEach(function (k) {
      var m = meshes[k];
      var goal = m.userData.goal || 0, dm = m.userData.dim || 0, was = dm;
      dm = Math.abs(goal - dm) > 0.004 && !reduce ? dm + (goal - dm) * step : goal;
      if (dm !== was || m.userData.dirty) { m.userData.dim = dm; m.userData.dirty = false; m.material.color.setHex(COLORS[level(k)]).lerp(GREY, dm); needs = true; }
      var lift = m.userData.lift || 0, s = m.scale.x, target = 1 + 0.035 * lift;
      if (Math.abs(target - s) > 0.0005) {
        var ns = reduce ? target : s + (target - s) * step, c = centers[k];
        m.scale.setScalar(ns); m.position.set(c.x * (1 - ns), c.y * (1 - ns), c.z * (1 - ns)); needs = true;
      }
      var glow = 0;
      if (lift && !reduce) { var age = (now - pulse) / 1000; if (age < 1.6) { glow = 0.28 * Math.sin(age * Math.PI / 1.6) * (0.6 + 0.4 * Math.sin(age * 9)); needs = true; } }
      m.material.emissive.setHex(lift ? COLORS[level(k)] : 0x000000); m.material.emissiveIntensity = glow;
    });
    if (needs) { renderer.render(scene, camera); needs = false; }
  }

  // What the app calls: `set` with any part of the state, `select` with a muscle or null.
  window.fuel = {
    set: function (next) {
      var moved = ready && (next.top !== undefined && next.top !== state.top || next.bottom !== undefined && next.bottom !== state.bottom);
      for (var key in next) state[key] = next[key];
      apply();
      if (moved && !anim) look(null, true);
    },
    select: function (k, part) { select(k || null, part); }
  };
  if (window.__fuel) window.fuel.set(window.__fuel);
  // On the web the page sits in a frame and the app writes to it.
  window.addEventListener('message', function (e) {
    var m; try { m = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (err) { return; }
    if (!m || !m.fuel) return;
    if (m.fuel === 'set') window.fuel.set(m.state); else if (m.fuel === 'select') window.fuel.select(m.muscle, m.part);
  });

  apply();
  // The model is decoded by the browser itself: much quicker than a loop over the characters.
  fetch('data:application/octet-stream;base64,' + window.__BODY_B64)
    .then(function (r) { return r.arrayBuffer(); })
    .then(function (buf) { window.__BODY_B64 = null; init(buf); })
    .catch(function () { post({ type: 'failed' }); });
})();
</script>
</body>
</html>
